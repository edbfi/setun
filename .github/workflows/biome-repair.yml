name: Biome repair
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: biome-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  repair:
    uses: edbfi/automation/.github/workflows/biome-repair.yml@v1.2.0
    with:
      config-files: biome.json
      source-roots: |
        src
        sandbox
        vite.config.ts
        playwright.config.ts
        uno.config.ts
        svelte.config.js
        server.js
        tailwind.config.js
        tsconfig.json
        components.json
      bun-version: 1.4.2
'on':
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
